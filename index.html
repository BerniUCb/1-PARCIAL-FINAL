<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Totalizador</title>
  </head>
  <body>
    <h1>Totalizador</h1>
    <form id="totalizador-form">
      <label for="cantidad">Cantidad de item:</label>
      <input type="number" id="cantidad" />
      <label for="precio">Precio por item:</label>
      <input type="number" id="precio" />
      <label for="estado">Codigo de estado:</label>
      <select id="estado">
        <option value="CA">CA - California</option>
        <option value="AL">AL - Alabama</option>
        <option value="NV">NV - Nevada</option>
        <option value="TX">TX - Texas</option>
        <option value="UT">UT - Utah</option>
      </select>
      <input type="submit" value="Totalizar" id="totalizar-button" />
      <button type="button" id="cancelar-button">Cancelar</button>
    </form>
    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
